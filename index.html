<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="google" content="notranslate" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Primary SEO -->
    <title>Northern Soul - Wooden Architecture & Rural Heritage Foundation</title>
    <meta name="description" content="Northern Soul is a non-profit foundation dedicated to preserving the wooden architecture and cultural heritage of the Baltic-Slavic north. Support restoration of historic churches, lectures, and expeditions." />
    <meta name="keywords" content="wooden architecture, cultural heritage, historic preservation, Russian north, Baltic-Slavic heritage, foundation, non-profit, restoration" />
    <meta name="author" content="Northern Soul Foundation" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://northern-soul.vercel.app/" />

    <!-- Open Graph (Facebook, LinkedIn, Telegram, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Northern Soul Foundation" />
    <meta property="og:title" content="Northern Soul - Wooden Architecture & Rural Heritage Foundation" />
    <meta property="og:description" content="A non-profit foundation preserving the wooden architecture and cultural heritage of the Baltic-Slavic north." />
    <meta property="og:url" content="https://northern-soul.vercel.app/" />
    <meta property="og:image" content="https://northern-soul.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Northern Soul Foundation - Wooden Architecture Heritage" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Northern Soul - Wooden Architecture & Rural Heritage Foundation" />
    <meta name="twitter:description" content="A non-profit foundation preserving the wooden architecture and cultural heritage of the Baltic-Slavic north." />
    <meta name="twitter:image" content="https://northern-soul.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Northern Soul Foundation - Wooden Architecture Heritage" />

    <!-- Theme colors -->
    <meta name="theme-color" content="#1a1a1a" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico?v=2" />

    <!-- Structured data: NGO schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Northern Soul Foundation",
        "url": "https://northern-soul.vercel.app/",
        "logo": "https://northern-soul.vercel.app/og-image.png",
        "description": "A non-profit foundation dedicated to preserving the wooden architecture and cultural heritage of the Baltic-Slavic north.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Vilnius LT-01103",
          "addressLocality": "Vilnius",
          "addressCountry": "LT"
        },
        "sameAs": []
      }
    </script>

    <link
      rel="preload"
      as="image"
      type="image/webp"
      media="(max-width: 767px)"
      href="/images/heroMobile.webp"
    />
  </head>
  <body class="notranslate">
    <div class="ssr-fallback" id="ssrFallback">
      <img
        class="ssr-fallback__image"
        src="/images/heroMobile.webp"
        alt=""
        fetchpriority="high"
        width="375"
        height="667"
      />
    </div>
    <div id="root"></div>
    <script>
      // Hide the fallback once React has mounted the real app.
      // Uses requestIdleCallback with a rAF fallback for older browsers.
      const hideFallback = () => {
        const el = document.getElementById('ssrFallback');
        if (el) el.style.display = 'none';
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(hideFallback, { timeout: 3000 });
      } else {
        requestAnimationFrame(() => setTimeout(hideFallback, 100));
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
